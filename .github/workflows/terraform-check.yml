name: Terraform Validation

on:
  pull_request:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tfvars.json"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform-check.yml"
  push:
    branches: [main]
    paths:
      - "**/*.tf"
      - "**/*.tfvars"
      - "**/*.tfvars.json"
      - "**/.terraform.lock.hcl"
      - ".github/workflows/terraform-check.yml"

permissions:
  contents: read

env:
  TF_IN_AUTOMATION: "true"
  TF_PLUGIN_CACHE_DIR: /tmp/terraform-plugin-cache

jobs:
  terraform-validate:
    name: Terraform fmt / validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.10.5"

      - name: Prepare Terraform plugin cache
        run: mkdir -p "$TF_PLUGIN_CACHE_DIR"

      - name: Cache Terraform providers
        uses: actions/cache@v4
        with:
          path: /tmp/terraform-plugin-cache
          key: terraform-${{ runner.os }}-1.10.5-${{ hashFiles('**/.terraform.lock.hcl', '**/versions.tf') }}
          restore-keys: |
            terraform-${{ runner.os }}-1.10.5-

      - name: Check formatting
        run: terraform fmt -check -recursive -diff

      - name: Validate Terraform directories
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t tf_dirs < <(
            find . -type f -name '*.tf' \
              -not -path './.git/*' \
              -not -path '*/.terraform/*' \
              -printf '%h\n' | sort -u
          )

          if [ "${#tf_dirs[@]}" -eq 0 ]; then
            echo "No Terraform directories found."
            exit 0
          fi

          for dir in "${tf_dirs[@]}"; do
            echo "::group::Validating ${dir}"
            terraform -chdir="$dir" init -backend=false -input=false -no-color
            terraform -chdir="$dir" validate -no-color
            echo "::endgroup::"
          done
