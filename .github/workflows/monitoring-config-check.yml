name: Monitoring Config Checks
on:
  pull_request:
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-config-check.yml'
  push:
    branches: [main]
    paths:
      - 'monitoring/**'
      - '.github/workflows/monitoring-config-check.yml'
permissions:
  contents: read
jobs:
  offline-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install YAML parser
        run: python -m pip install PyYAML==6.0.2
      - name: Check monitoring structure
        run: python monitoring/tests/validate_configs.py
      - name: Check Blackbox installer shell syntax
        run: bash -n monitoring/blackbox-cloud/install.sh
      - name: Test direct reload checks
        run: python monitoring/blackbox-cloud/test_reload_check.py
      - name: Test Grafana query and expression safety checks
        run: python monitoring/grafana-alerting/test_prechecks.py
