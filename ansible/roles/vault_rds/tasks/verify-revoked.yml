---
- name: Require the previously issued Vault credential
  ansible.builtin.assert:
    that:
      - vault_rds_endpoint | length > 0
      - vault_rds_dynamic_username is match('^[A-Za-z0-9_]+$')
      - vault_rds_dynamic_password | length > 0
    fail_msg: "TTL 만료 또는 Vault revoke 전의 동적 username/password를 안전한 방식으로 입력하세요."
  no_log: true

- name: Confirm revoked dynamic credential can no longer connect
  ansible.builtin.shell: |
    mariadb --protocol=tcp \
      --connect-timeout=5 \
      --host="{{ vault_rds_endpoint }}" --port="{{ vault_rds_port }}" \
      --user="{{ vault_rds_dynamic_username }}" --password="$VAULT_DYNAMIC_PASSWORD" \
      --database="{{ vault_rds_database }}" \
      --execute "SELECT 1;"
  args:
    executable: /bin/bash
  environment:
    VAULT_DYNAMIC_PASSWORD: "{{ vault_rds_dynamic_password }}"
  register: vault_rds_revoked_login
  changed_when: false
  failed_when: vault_rds_revoked_login.rc == 0
  no_log: true

- name: Report successful TTL revoke validation
  ansible.builtin.debug:
    msg: "Vault 동적 계정 {{ vault_rds_dynamic_username }}은(는) TTL 만료 또는 revoke 후 RDS 접속이 차단됐습니다."
