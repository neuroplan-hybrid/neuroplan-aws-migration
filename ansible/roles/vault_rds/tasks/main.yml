---
- name: Validate Vault RDS role context
  ansible.builtin.assert:
    that:
      - vault_rds_node_role in ["controller", "onprem_replica"]
      - vault_rds_run_mode in ["preflight", "provision-manager", "verify-manager", "verify-issued", "verify-revoked", "verify-replication"]
      - vault_rds_database is match('^[A-Za-z0-9_]+$')
      - vault_rds_manager_username is match('^[A-Za-z0-9_]+$')
      - vault_rds_dynamic_host in ["%", "localhost"]
    fail_msg: "Vault RDS 역할명·DB명·실행 모드 값을 확인하세요. 식별자는 영문·숫자·밑줄만 사용합니다."
  tags: [always]

- name: Run read-only controller preflight
  ansible.builtin.import_tasks: controller-preflight.yml
  when:
    - vault_rds_node_role == "controller"
    - vault_rds_run_mode == "preflight"
  tags: [preflight]

- name: Create the dedicated Vault RDS management account
  ansible.builtin.import_tasks: provision-manager.yml
  when:
    - vault_rds_node_role == "controller"
    - vault_rds_run_mode == "provision-manager"
  tags: [provision-manager]

- name: Verify the dedicated Vault RDS management account
  ansible.builtin.import_tasks: verify-manager.yml
  when:
    - vault_rds_node_role == "controller"
    - vault_rds_run_mode == "verify-manager"
  tags: [verify-manager]

- name: Verify a currently issued Vault dynamic credential
  ansible.builtin.import_tasks: verify-issued.yml
  when:
    - vault_rds_node_role == "controller"
    - vault_rds_run_mode == "verify-issued"
  tags: [verify-issued]

- name: Verify a revoked Vault dynamic credential no longer connects
  ansible.builtin.import_tasks: verify-revoked.yml
  when:
    - vault_rds_node_role == "controller"
    - vault_rds_run_mode == "verify-revoked"
  tags: [verify-revoked]

- name: Verify Vault account DDL is replicated to On-Prem
  ansible.builtin.import_tasks: verify-replication.yml
  when:
    - vault_rds_node_role == "onprem_replica"
    - vault_rds_run_mode == "verify-replication"
  tags: [verify-replication]
