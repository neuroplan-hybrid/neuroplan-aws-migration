---
- name: Require the dedicated Vault management credential
  ansible.builtin.assert:
    that:
      - vault_rds_endpoint | length > 0
      - vault_rds_manager_password | length > 0
    fail_msg: "Vault 관리 계정의 RDS Endpoint와 비밀번호를 안전한 방식으로 입력하세요."
  no_log: true

- name: Read Vault management account grants
  ansible.builtin.shell: |
    set -euo pipefail
    mariadb --protocol=tcp \
      --host="{{ vault_rds_endpoint }}" --port="{{ vault_rds_port }}" \
      --user="{{ vault_rds_manager_username }}" --password="$VAULT_RDS_MANAGER_PASSWORD" \
      --execute "SHOW GRANTS;"
  args:
    executable: /bin/bash
  environment:
    VAULT_RDS_MANAGER_PASSWORD: "{{ vault_rds_manager_password }}"
  register: vault_rds_manager_grants
  changed_when: false
  no_log: true

- name: Require minimum grants for Vault dynamic application accounts
  ansible.builtin.assert:
    that:
      - vault_rds_manager_grants.stdout is search('GRANT CREATE USER ON \\*\\.\\*')
      - vault_rds_manager_grants.stdout is search('GRANT SELECT, INSERT, UPDATE, DELETE ON `?{{ vault_rds_database }}`?\\.\\*')
      - vault_rds_manager_grants.stdout is search('WITH GRANT OPTION')
    fail_msg: "Vault 관리 계정에 CREATE USER와 {{ vault_rds_database }}.* CRUD WITH GRANT OPTION이 없습니다."
  no_log: true

- name: Report validated Vault management account scope
  ansible.builtin.debug:
    msg: "Vault 관리 계정 {{ vault_rds_manager_username }}의 최소 권한을 확인했습니다."
