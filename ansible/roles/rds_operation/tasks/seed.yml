---
- name: Require explicit mutation approval
  ansible.builtin.assert:
    that:
      - rds_operation_execute_mutations | bool
    fail_msg: "seed에는 rds_operation_execute_mutations=true가 필요합니다."

- name: Discover latest valid On-Prem backup and matching GTID
  ansible.builtin.import_tasks: discover-seed-backup.yml

- name: Load RDS Master credentials
  ansible.builtin.import_tasks: load-master-secret.yml

- name: Import selected logical backup into RDS
  ansible.builtin.shell: |
    set -o pipefail
    gzip -dc "{{ rds_operation_seed_sql_gz }}"       | mariadb --protocol=tcp           --host="{{ rds_operation_endpoint }}"           --port="{{ rds_operation_port }}"           --user="{{ rds_operation_master_secret.username }}"           --password="$RDS_MASTER_PASSWORD"
  args:
    executable: /bin/bash
  environment:
    RDS_MASTER_PASSWORD: "{{ rds_operation_master_secret.password }}"
  no_log: true

- name: Verify imported database collation
  ansible.builtin.shell: |
    mariadb --protocol=tcp --batch --skip-column-names       --host="{{ rds_operation_endpoint }}" --port="{{ rds_operation_port }}"       --user="{{ rds_operation_master_secret.username }}" --password="$RDS_MASTER_PASSWORD"       --execute "SELECT DEFAULT_COLLATION_NAME FROM information_schema.SCHEMATA WHERE SCHEMA_NAME='{{ rds_operation_database }}';"
  args:
    executable: /bin/bash
  environment:
    RDS_MASTER_PASSWORD: "{{ rds_operation_master_secret.password }}"
  register: rds_operation_imported_collation
  changed_when: false
  no_log: true

- name: Require expected imported database collation
  ansible.builtin.assert:
    that:
      - rds_operation_imported_collation.stdout | trim == rds_operation_database_collation
    fail_msg: "Import된 DB 기본 Collation이 {{ rds_operation_database_collation }}이 아닙니다."
