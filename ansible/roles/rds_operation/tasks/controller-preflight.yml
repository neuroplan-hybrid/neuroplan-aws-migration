---
- name: Require discovered RDS connection values
  ansible.builtin.assert:
    that:
      - rds_operation_endpoint | length > 0
      - rds_operation_master_secret_arn | length > 0
    fail_msg: "RDS Endpoint 또는 Master Secret ARN 자동 조회에 실패했습니다."

- name: Verify TCP 3306 from the controller to RDS
  ansible.builtin.wait_for:
    host: "{{ rds_operation_endpoint }}"
    port: "{{ rds_operation_port }}"
    timeout: 10
    state: started
  changed_when: false
