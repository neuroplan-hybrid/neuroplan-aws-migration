---
- name: Require exactly one On-Prem primary for RDS inbound replication
  ansible.builtin.assert:
    that:
      - groups.get("onprem_primary", []) | length == 1
    fail_msg: "RDS inbound replication에는 inventory의 onprem_primary 한 대가 필요합니다."
  changed_when: false

- name: Require an explicit On-Prem replication address separate from SSH
  ansible.builtin.assert:
    that:
      - hostvars[groups['onprem_primary'] | first].rds_operation_replication_host | default('') is string
      - (hostvars[groups['onprem_primary'] | first].rds_operation_replication_host | default('') | trim) == (hostvars[groups['onprem_primary'] | first].rds_operation_replication_host | default(''))
      - hostvars[groups['onprem_primary'] | first].rds_operation_replication_host | default('') is match('^[A-Za-z0-9][A-Za-z0-9.-]*$')
    fail_msg: >-
      onprem_primary 호스트에 rds_operation_replication_host를 지정하세요.
      ansible_host는 SSH 관리망 주소이며 복제 주소로 자동 대체하지 않습니다.
      복제 주소는 RDS에서 접근 가능한 데이터망 IP 또는 DNS 이름이어야 합니다.
  changed_when: false

- name: Resolve RDS inbound replication source from inventory
  ansible.builtin.set_fact:
    rds_operation_inbound_source_inventory_hostname: "{{ groups['onprem_primary'] | first }}"
    rds_operation_inbound_source_host: >-
      {{ hostvars[groups['onprem_primary'] | first].rds_operation_replication_host }}
  changed_when: false

- name: Require resolved RDS inbound replication source address
  ansible.builtin.assert:
    that:
      - rds_operation_inbound_source_host | length > 0
    fail_msg: "inventory의 onprem_primary에서 RDS inbound replication Source 주소를 찾지 못했습니다."
  changed_when: false
