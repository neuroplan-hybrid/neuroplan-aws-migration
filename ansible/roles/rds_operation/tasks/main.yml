---
- name: Validate role context
  ansible.builtin.assert:
    that:
      - rds_operation_node_role in ["controller", "onprem_replica", "cutover_source"]
    fail_msg: "rds_operation_node_role이 올바르지 않습니다."
  tags: [always]

- name: Discover current RDS connection values on the controller
  ansible.builtin.import_tasks: discover-rds-connection.yml
  when:
    - rds_operation_node_role == "controller"
  tags: [always]

- name: Require a controller-discovered RDS connection for On-Prem replica work
  ansible.builtin.assert:
    that:
      - groups.get("rds_controller", []) | length == 1
      - hostvars[groups["rds_controller"][0]].rds_operation_endpoint | default("") | length > 0
      - hostvars[groups["rds_controller"][0]].rds_operation_port | default(0) | int > 0
    fail_msg: >-
      On-Prem Replica 작업에는 rds_controller가 먼저 자동 조회한
      RDS Endpoint와 Port가 필요합니다.
  when:
    - rds_operation_node_role == "onprem_replica"
    - rds_operation_run_mode in ["preflight", "configure-onprem-replica", "verify-onprem-replica"]
  tags: [always]

- name: Use the RDS connection discovered by the controller on On-Prem replicas
  ansible.builtin.set_fact:
    rds_operation_endpoint: >-
      {{ hostvars[groups["rds_controller"][0]].rds_operation_endpoint }}
    rds_operation_port: >-
      {{ hostvars[groups["rds_controller"][0]].rds_operation_port | int }}
  when:
    - rds_operation_node_role == "onprem_replica"
    - rds_operation_run_mode in ["preflight", "configure-onprem-replica", "verify-onprem-replica"]
  no_log: true
  tags: [always]

- name: Require a nonempty RDS endpoint before On-Prem replica work
  ansible.builtin.assert:
    that:
      - rds_operation_endpoint | length > 0
      - rds_operation_port | int > 0
    fail_msg: "On-Prem Replica 작업에 사용할 RDS Endpoint 또는 Port가 비어 있습니다."
  when:
    - rds_operation_node_role == "onprem_replica"
    - rds_operation_run_mode in ["preflight", "configure-onprem-replica", "verify-onprem-replica"]
  tags: [always]

- name: Run controller preflight
  ansible.builtin.import_tasks: controller-preflight.yml
  when:
    - rds_operation_node_role == "controller"
    - rds_operation_run_mode == "preflight"
  tags: [preflight]

- name: Run On-Prem replica preflight
  ansible.builtin.import_tasks: onprem-preflight.yml
  when:
    - rds_operation_node_role == "onprem_replica"
    - rds_operation_run_mode == "preflight"
  tags: [preflight]

- name: Prepare RDS as the external replication source
  ansible.builtin.import_tasks: rds-source.yml
  when:
    - rds_operation_node_role == "controller"
    - rds_operation_run_mode == "rds-source"
  tags: [rds-source]

- name: Resolve On-Prem Source from inventory for RDS inbound replication
  ansible.builtin.import_tasks: resolve-inbound-source.yml
  when:
    - rds_operation_node_role == "controller"
    - rds_operation_run_mode in ["seed", "configure-rds-inbound"]
  tags: [seed, configure-rds-inbound]

- name: Import approved initial logical backup into RDS
  ansible.builtin.import_tasks: seed.yml
  when:
    - rds_operation_node_role == "controller"
    - rds_operation_run_mode == "seed"
  tags: [seed]

- name: Prepare On-Prem source account for initial RDS catch-up
  ansible.builtin.import_tasks: prepare-inbound-source.yml
  when:
    - inventory_hostname in groups["onprem_primary"]
    - rds_operation_run_mode == "prepare-inbound-source"
  tags: [prepare-inbound-source]

- name: Configure temporary On-Prem to RDS GTID replication
  ansible.builtin.import_tasks: configure-rds-inbound.yml
  when:
    - rds_operation_node_role == "controller"
    - rds_operation_run_mode == "configure-rds-inbound"
  tags: [configure-rds-inbound]

- name: Verify temporary RDS inbound replication
  ansible.builtin.import_tasks: verify-rds-inbound.yml
  when:
    - rds_operation_node_role == "controller"
    - rds_operation_run_mode == "verify-rds-inbound"
  tags: [verify-rds-inbound]

- name: Fence former On-Prem primary for approved cutover
  ansible.builtin.import_tasks: fence-onprem-primary.yml
  when:
    - rds_operation_node_role == "cutover_source"
    - rds_operation_run_mode == "cutover"
  tags: [cutover]

- name: Finish approved RDS cutover
  ansible.builtin.import_tasks: finish-rds-cutover.yml
  when:
    - rds_operation_node_role == "controller"
    - rds_operation_run_mode == "cutover"
  tags: [cutover]

- name: Configure On-Prem node as RDS GTID replica
  ansible.builtin.import_tasks: configure-onprem-replica.yml
  when:
    - rds_operation_node_role == "onprem_replica"
    - rds_operation_run_mode == "configure-onprem-replica"
  tags: [configure-onprem-replica]

- name: Verify On-Prem RDS replica
  ansible.builtin.import_tasks: verify-onprem-replica.yml
  when:
    - rds_operation_node_role == "onprem_replica"
    - rds_operation_run_mode == "verify-onprem-replica"
  tags: [verify-onprem-replica]

- name: Promote the approved DR replica
  ansible.builtin.import_tasks: dr-promote.yml
  when:
    - rds_operation_node_role == "onprem_replica"
    - rds_operation_run_mode == "dr-promote"
  tags: [dr-promote]
