---
- name: Require static RDS application account inputs
  ansible.builtin.assert:
    that:
      - rds_operation_execute_mutations | bool
      - rds_operation_database is match('^[A-Za-z0-9_]+$')
      - rds_operation_app_username is match('^[A-Za-z0-9_]+$')
      - rds_operation_app_password | length > 0
      - rds_operation_app_password is match('^[A-Za-z0-9]+$')
      - rds_operation_app_hosts | length > 0
      - >-
        (rds_operation_app_hosts
        | select('match', '^[A-Za-z0-9.%_-]+$')
        | list
        | length) == (rds_operation_app_hosts | length)
    fail_msg: >-
      provision-rds-app-account에는 변경 승인, 영숫자 앱 비밀번호와
      유효한 접속 Host 패턴이 필요합니다.
  no_log: true

- name: Load RDS Master credentials
  ansible.builtin.import_tasks: load-master-secret.yml

- name: Reset direct grants and provision the CRUD-only static RDS application account
  ansible.builtin.shell: |
    set -euo pipefail
    umask 077
    workdir="$(mktemp -d "${TMPDIR:-/tmp}/rds-app-account.XXXXXX")"
    cleanup() {
      rm -f "$workdir/master.cnf" "$workdir/provision.sql"
      rmdir "$workdir"
    }
    trap cleanup EXIT

    cat > "$workdir/master.cnf" <<'EOF'
    [client]
    protocol=tcp
    host={{ rds_operation_endpoint }}
    port={{ rds_operation_port }}
    user={{ rds_operation_master_secret.username }}
    password={{ rds_operation_master_secret.password | to_json }}
    EOF
    chmod 600 "$workdir/master.cnf"

    cat > "$workdir/provision.sql" <<'SQL'
    {% for host in rds_operation_app_hosts %}
    CREATE USER IF NOT EXISTS '{{ rds_operation_app_username }}'@'{{ host }}'
      IDENTIFIED BY '{{ rds_operation_app_password }}';
    REVOKE ALL PRIVILEGES, GRANT OPTION
      FROM '{{ rds_operation_app_username }}'@'{{ host }}';
    ALTER USER '{{ rds_operation_app_username }}'@'{{ host }}'
      IDENTIFIED BY '{{ rds_operation_app_password }}';
    GRANT SELECT, INSERT, UPDATE, DELETE
      ON `{{ rds_operation_database }}`.*
      TO '{{ rds_operation_app_username }}'@'{{ host }}';
    {% endfor %}
    SQL
    chmod 600 "$workdir/provision.sql"

    mariadb --defaults-extra-file="$workdir/master.cnf" < "$workdir/provision.sql"
  args:
    executable: /bin/bash
  no_log: true
