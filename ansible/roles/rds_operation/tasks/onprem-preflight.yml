---

- name: Read On-Prem MariaDB replication prerequisites
  ansible.builtin.command:
    argv:
      - mariadb
      - --protocol=socket
      - --batch
      - --skip-column-names
      - --execute
      - >-
        SELECT @@hostname, @@version, @@log_bin, @@binlog_format,
        @@gtid_strict_mode, @@log_slave_updates, @@read_only, @@gtid_current_pos;
  register: rds_operation_onprem_prerequisites
  changed_when: false

- name: Display On-Prem MariaDB prerequisites
  ansible.builtin.debug:
    var: rds_operation_onprem_prerequisites.stdout_lines
