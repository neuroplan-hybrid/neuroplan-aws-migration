---
- name: Require static RDS application account verification inputs
  ansible.builtin.assert:
    that:
      - rds_operation_database is match('^[A-Za-z0-9_]+$')
      - rds_operation_app_username is match('^[A-Za-z0-9_]+$')
      - rds_operation_app_password | length > 0
      - rds_operation_app_password is match('^[A-Za-z0-9]+$')
      - rds_operation_app_hosts | length > 0
      - >-
        (rds_operation_app_hosts
        | select('match', '^[A-Za-z0-9.%_-]+$')
        | list
        | length) == (rds_operation_app_hosts | length)
    fail_msg: >-
      verify-rds-app-account에는 앱 계정·비밀번호와 유효한 접속 Host 패턴이 필요합니다.
  no_log: true

- name: Load RDS Master credentials
  ansible.builtin.import_tasks: load-master-secret.yml

- name: Create private staging directory for RDS app account verification
  ansible.builtin.tempfile:
    state: directory
    prefix: rds-app-account-verify-
  register: rds_operation_app_account_verify_staging
  no_log: true

- name: Verify static RDS application account has CRUD-only grants and can read
  block:
    - name: Write private RDS Master verification client option file
      ansible.builtin.copy:
        dest: "{{ rds_operation_app_account_verify_staging.path }}/master.cnf"
        mode: "0600"
        content: |
          [client]
          protocol=tcp
          host={{ rds_operation_endpoint }}
          port={{ rds_operation_port }}
          user={{ rds_operation_master_secret.username }}
          password={{ rds_operation_master_secret.password | to_json }}
      no_log: true

    - name: Write private static RDS application client option file
      ansible.builtin.copy:
        dest: "{{ rds_operation_app_account_verify_staging.path }}/app.cnf"
        mode: "0600"
        content: |
          [client]
          protocol=tcp
          host={{ rds_operation_endpoint }}
          port={{ rds_operation_port }}
          user={{ rds_operation_app_username }}
          password={{ rds_operation_app_password | to_json }}
      no_log: true

    - name: Verify static RDS application account grants and read authentication
      ansible.builtin.shell: |
        set -euo pipefail
        grant_quote="$(printf '\140')"

        {% for host in rds_operation_app_hosts %}
        account_display="${grant_quote}{{ rds_operation_app_username }}${grant_quote}@${grant_quote}{{ host }}${grant_quote}"
        expected_usage="GRANT USAGE ON *.* TO $account_display"
        expected_crud="GRANT SELECT, INSERT, UPDATE, DELETE ON ${grant_quote}{{ rds_operation_database }}${grant_quote}.* TO $account_display"

        is_valid_usage_grant() {
          local grant="$1"
          local suffix
          [[ "$grant" == "$expected_usage"* ]] || return 1
          suffix="${grant#"$expected_usage"}"
          [[ -z "$suffix" ]] && return 0
          [[ "$suffix" =~ ^\ IDENTIFIED\ BY\ PASSWORD\ [^[:space:]]+$ ]]
        }

        # MariaDB SHOW GRANTS 정상 형식과 초과 권한 거부를 같은 matcher로 점검한다.
        is_valid_usage_grant "$expected_usage"
        is_valid_usage_grant "$expected_usage IDENTIFIED BY PASSWORD '*FAKEHASH'"
        if is_valid_usage_grant "$expected_usage WITH GRANT OPTION"; then
          echo "grant matcher accepted an excessive usage grant" >&2
          exit 1
        fi
        [[ "$expected_crud" == "GRANT SELECT, INSERT, UPDATE, DELETE ON ${grant_quote}{{ rds_operation_database }}${grant_quote}.* TO $account_display" ]]

        grants="$(mariadb --defaults-extra-file="{{ rds_operation_app_account_verify_staging.path }}/master.cnf" --batch --skip-column-names \
          --execute "SHOW GRANTS FOR '{{ rds_operation_app_username }}'@'{{ host }}';")"

        usage_seen=false
        crud_seen=false
        while IFS= read -r grant; do
          if is_valid_usage_grant "$grant"; then
            usage_seen=true
          elif [[ "$grant" == "$expected_crud" ]]; then
            crud_seen=true
          else
            echo "unexpected grant for $account_display" >&2
            exit 1
          fi
        done <<<"$grants"

        [[ "$usage_seen" == true && "$crud_seen" == true ]] || {
          echo "required CRUD grants are missing for $account_display" >&2
          exit 1
        }

        mariadb --defaults-extra-file="{{ rds_operation_app_account_verify_staging.path }}/app.cnf" --batch --skip-column-names \
          --database="{{ rds_operation_database }}" \
          --execute "SELECT CURRENT_USER(), DATABASE(), 1;" >/dev/null
        {% endfor %}
      args:
        executable: /bin/bash
      changed_when: false
      no_log: true
  always:
    - name: Remove private RDS app account verification staging files
      ansible.builtin.file:
        path: "{{ rds_operation_app_account_verify_staging.path }}"
        state: absent
      no_log: true

- name: Display static RDS application account verification result
  ansible.builtin.debug:
    msg: "RDS static application account CRUD-only grants and read authentication succeeded."
