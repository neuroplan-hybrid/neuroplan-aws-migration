---
# 이 Playbook은 RDS가 On-Prem Source를 따라잡은 뒤 RDS를 쓰기 Primary로 전환한다.
# 실행 전에는 정상 애플리케이션 쓰기를 사람이 차단해야 한다.

- name: Fence the former On-Prem primary after approved cutover
  hosts: onprem_primary
  become: true
  gather_facts: false
  vars:
    rds_operation_node_role: cutover_source
    rds_operation_run_mode: cutover
  roles:
    - role: rds_operation

- name: Stop RDS inbound replication and make RDS the writable primary
  hosts: rds_controller
  gather_facts: false
  vars:
    rds_operation_node_role: controller
    rds_operation_run_mode: cutover
  roles:
    - role: rds_operation
